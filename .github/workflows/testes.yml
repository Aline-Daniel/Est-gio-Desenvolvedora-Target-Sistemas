name: Testes de analise de dados
on:
  push:
    branches: [master, 'melhorias/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
